<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator — University of Haripur</title>
<!-- Modern Fonts: Inter & Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<!-- html2pdf for PDF Export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  :root {
    /* Modern Dark Glassmorphism Theme */
    --bg:        #0f172a;
    --glass:     rgba(255, 255, 255, 0.05);
    --border:    rgba(255, 255, 255, 0.1);
    --primary:   #3b82f6;
    --primary-hover: #2563eb;
    --secondary: #6366f1;
    --text:      #f8fafc;
    --muted:     #94a3b8;
    --danger:    #ef4444;
    --warn:      #f59e0b;
    --success:   #10b981;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Animated Background ── */
  #bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }

  /* ── Layout ── */
  .app {
    position: relative; z-index: 2;
    max-width: 880px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 52px 0 32px;
    position: relative;
  }
  .logo-wrap {
    display: inline-block;
    margin-bottom: 16px;
    position: relative;
  }
  .logo-wrap img {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid var(--primary);
    box-shadow: 0 0 20px rgba(59,130,246,0.3), 0 0 60px rgba(59,130,246,0.1);
  }
  .logo-ring {
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(59,130,246,0.3);
    animation: spin 8s linear infinite;
  }
  .logo-ring::before {
    content: '';
    position: absolute; top: -2px; left: 50%;
    width: 5px; height: 5px;
    background: var(--primary);
    border-radius: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 8px var(--primary);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(22px, 5vw, 38px);
    font-weight: 700;
    letter-spacing: 0.05em;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }

  .subtitle {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── Glass Card ── */
  .card {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 28px 28px 24px;
    margin-bottom: 20px;
    position: relative;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
  }
  
  .card-title {
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .card-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  /* ── Form Elements ── */
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .form-row.single { grid-template-columns: 1fr; }

  label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="number"] {
    width: 100%;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: all 0.2s;
  }
  input:focus {
    border-color: var(--primary);
    background: rgba(0, 0, 0, 0.4);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }
  input::placeholder { color: rgba(255, 255, 255, 0.2); }

  /* ── Semester Counter ── */
  .counter-row {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 20px;
  }
  .counter-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    flex: 1;
  }
  .counter-ctrl {
    display: flex; align-items: center; gap: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .counter-btn {
    background: rgba(255, 255, 255, 0.05);
    border: none;
    color: var(--text);
    font-size: 18px;
    width: 40px; height: 40px;
    cursor: pointer;
    transition: background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .counter-btn:hover { background: rgba(255, 255, 255, 0.1); }
  .counter-val {
    width: 48px; text-align: center;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    background: rgba(0, 0, 0, 0.3);
    height: 40px;
    line-height: 40px;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ── Subject Row ── */
  .subject-block {
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    background: rgba(0, 0, 0, 0.15);
    transition: border-color 0.2s;
  }
  .subject-block:hover { border-color: rgba(255, 255, 255, 0.15); }
  .subject-num {
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    font-weight: 600;
    color: var(--primary);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }
  .subject-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 12px;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 14px 28px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
  }
  .btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--text);
  }
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.15);
  }
  .btn-danger {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: var(--danger);
  }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
  
  .btn-row {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-top: 8px;
  }

  /* ── Semester Tabs ── */
  .tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .tab {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 8px 18px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: rgba(59, 130, 246, 0.15);
    border-color: var(--primary);
    color: var(--primary);
  }
  .tab:hover:not(.active) { border-color: rgba(255, 255, 255, 0.3); color: var(--text); }

  /* ── Results ── */
  #results-section { display: none; }

  .gpa-display {
    text-align: center;
    padding: 30px 0;
  }
  .gpa-value {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(48px, 10vw, 80px);
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, var(--primary), #818cf8);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .gpa-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-top: 8px;
  }

  .grade-bar-wrap {
    margin: 24px auto;
    max-width: 500px;
  }
  .grade-bar-bg {
    height: 8px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
    overflow: hidden;
  }
  .grade-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    box-shadow: 0 0 10px var(--primary);
    transition: width 1s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }

  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .result-table th {
    text-align: left;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--muted);
    padding: 12px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }
  .result-table td {
    padding: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    color: var(--text);
  }
  .result-table tr:hover td { background: rgba(255, 255, 255, 0.02); }

  .grade-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 700;
  }
  .grade-A  { background: rgba(16, 185, 129, 0.15); color: #34d399; }
  .grade-Am { background: rgba(16, 185, 129, 0.1);  color: #6ee7b7; }
  .grade-Bp { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
  .grade-B  { background: rgba(59, 130, 246, 0.1);  color: #93c5fd; }
  .grade-Bm { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; }
  .grade-C  { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
  .grade-D  { background: rgba(249, 115, 22, 0.15); color: #fb923c; }
  .grade-F  { background: rgba(239, 68, 68, 0.15);  color: #f87171; }

  .sem-summary {
    display: flex; flex-wrap: wrap; gap: 12px;
    margin-top: 12px;
  }
  .sem-pill {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    background: rgba(0, 0, 0, 0.2);
    text-align: center;
    flex: 1;
  }
  .sem-pill-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .sem-pill-value {
    font-family: 'Poppins', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
  }

  .alert {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--danger);
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  footer {
    text-align: center;
    padding: 40px 0 20px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  footer span { color: #ef4444; }

  .hidden { display: none !important; }
  .text-primary { color: var(--primary); }
  .text-right { text-align: right; }

  @media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
    .subject-grid { grid-template-columns: 1fr 1fr; }
    .subject-grid .subject-name { grid-column: 1/-1; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="app">

  <!-- Header -->
  <header>
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <!-- Placeholder SVG since base64 was too large/unnecessary, replace with real logo if needed -->
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%233b82f6'><circle cx='50' cy='50' r='50' fill='%231e293b'/><text x='50' y='65' font-family='Arial' font-size='40' font-weight='bold' fill='%233b82f6' text-anchor='middle'>UoH</text></svg>" alt="University of Haripur Logo" style="display:block;">
    </div>
    <h1>GPA CALCULATOR</h1>
    <p class="subtitle">University of Haripur</p>
  </header>

  <!-- Student Info -->
  <div class="card">
    <div class="card-title">Student Information</div>
    <div class="form-row">
      <div>
        <label>Full Name</label>
        <input type="text" id="stu-name" placeholder="Enter your name">
      </div>

        <label>Roll Number</label>

      <div>
        <label>Program / Department</label>

  <!-- Semesters Config -->
  <div class="card">
    <div class="card-title">Configuration</div>
    <div class="counter-row">
      <span class="counter-label">Number of Semesters</span>
      <div class="counter-ctrl">
        <button class="counter-btn" id="sem-dec">−</button>
        <div class="counter-val" id="sem-count">1</div>
        <button class="counter-btn" id="sem-inc">+</button>
      </div>
    </div>

  <!-- Dynamic Semester Sheets -->
  <div id="sem-sheets"></div>

  <!-- Alert -->
  <div class="alert" id="alert-box"></div>

  <!-- Calculate Button -->
  <div id="calc-wrap" class="hidden">
    <div class="btn-row">
      <button class="btn btn-primary" id="calc-btn">CALCULATE GPA</button>
      <button class="btn btn-danger" id="reset-btn">RESET</button>
    </div>
  </div>

  <!-- Results -->
  <div id="results-section">
    <div class="card" style="margin-top: 30px;">
      <div class="card-title">CGPA Overview</div>
      <div class="gpa-display">
        <div class="gpa-value" id="cgpa-display">0.00</div>
        <div class="gpa-label">CUMULATIVE GRADE POINT AVERAGE / 4.00</div>
        <div class="grade-bar-wrap">
          <div class="grade-bar-bg">
            <div class="grade-bar-fill" id="grade-bar"></div>
          </div>
        </div>
      </div>
      <div class="sem-summary" id="sgpa-pills"></div>
    </div>

    <div class="card" id="detail-card">
      <div class="card-title" style="display: flex; justify-content: space-between;">
        <span>Detailed Results</span>
        <button class="btn btn-secondary" id="pdf-btn" style="padding: 6px 12px; font-size: 10px;">EXPORT TO PDF</button>
      </div>
      <div class="tabs" id="result-tabs"></div>

    </div>
  </div>

  <!-- Footer -->
  <footer>
    Built with <span>❤️</span> By HAMID SHAFIQ &nbsp;·&nbsp; University of Haripur &nbsp;·&nbsp; COPYRIGHT 2026
  </footer>
</div>

<script>
/* ── Background Particle Canvas (Modern Blue Tech Vibe) ── */
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const count = 70;
  particles = Array.from({length: count}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.5 + 0.5,
    vx: (Math.random() - 0.5) * 0.2,
    vy: (Math.random() - 0.5) * 0.2,
    a: Math.random() * 0.5 + 0.1
  }));

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Deep modern tech gradients
    const grad = ctx.createRadialGradient(W*0.3, H*0.4, 0, W*0.3, H*0.4, W*0.6);
    grad.addColorStop(0, 'rgba(59, 130, 246, 0.05)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(99, 102, 241, ${p.a})`;
      ctx.fill();
    });

    for (let i = 0; i < particles.length; i++) {
      for (let j = i+1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(59, 130, 246, ${0.1 * (1 - dist/120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ── Grading Table (University of Haripur) ── */
const GRADE_TABLE = [
  [85, 100, 4.00, 'A'], [84, 84, 3.90, 'A-'], [83, 83, 3.80, 'A-'], [82, 82, 3.70, 'A-'],
  [81, 81, 3.60, 'A-'], [80, 80, 3.50, 'A-'], [79, 79, 3.42, 'B+'], [78, 78, 3.33, 'B+'],
  [77, 77, 3.25, 'B+'], [76, 76, 3.17, 'B+'], [75, 75, 3.08, 'B+'], [74, 74, 3.00, 'B'],
  [73, 73, 2.92, 'B'],  [72, 72, 2.83, 'B'],  [71, 71, 2.75, 'B'],  [70, 70, 2.67, 'B-'],
  [69, 69, 2.58, 'B-'], [68, 68, 2.50, 'B-'], [67, 67, 2.42, 'C+'], [66, 66, 2.33, 'C+'],
  [65, 65, 2.25, 'C+'], [64, 64, 2.17, 'C+'], [63, 63, 2.08, 'C'],  [62, 62, 2.00, 'C'],
  [61, 61, 1.92, 'C'],  [60, 60, 1.83, 'C-'], [59, 59, 1.75, 'C-'], [58, 58, 1.67, 'C-'],
  [57, 57, 1.58, 'D+'], [56, 56, 1.50, 'D+'], [55, 55, 1.42, 'D+'], [54, 54, 1.33, 'D+'],
  [53, 53, 1.25, 'D'],  [52, 52, 1.17, 'D'],  [51, 51, 1.08, 'D'],  [50, 50, 1.00, 'D'],
  [0,  49, 0.00, 'F']
];

function getGrade(pct) {
  const p = Math.floor(pct);
  for (const [lo, hi, ng, letter] of GRADE_TABLE) {
    if (p >= lo && p <= hi) return { ng, letter };
  }
  return { ng: 0.00, letter: 'F' };
}

function gradeBadgeClass(letter) {
  if (letter === 'A')  return 'grade-A';
  if (letter === 'A-') return 'grade-Am';
  if (letter === 'B+') return 'grade-Bp';
  if (letter === 'B')  return 'grade-B';
  if (letter === 'B-') return 'grade-Bm';
  if (letter.startsWith('C')) return 'grade-C';
  if (letter.startsWith('D')) return 'grade-D';
  return 'grade-F';
}

/* ── Semester Counter ── */
let semCount = 1;
document.getElementById('sem-dec').addEventListener('click', () => {
  if (semCount > 1) { semCount--; document.getElementById('sem-count').textContent = semCount; }
});
document.getElementById('sem-inc').addEventListener('click', () => {
  if (semCount < 8) { semCount++; document.getElementById('sem-count').textContent = semCount; }
});

/* ── Build Semester Sheets (Preserves Data) ── */
document.getElementById('build-btn').addEventListener('click', buildSheets);

function buildSheets() {
  const sheets = document.getElementById('sem-sheets');
  document.getElementById('results-section').style.display = 'none';
  document.getElementById('calc-wrap').classList.remove('hidden');

  // Instead of clearing HTML (which deletes data), toggle visibility or append new elements
  for (let s = 1; s <= 8; s++) { // Max 8 Semesters
    let card = document.getElementById(`sem-card-${s}`);
    
    // Create card if it doesn't exist and is within selected semCount
    if (!card && s <= semCount) {
      card = document.createElement('div');
      card.className = 'card';
      card.id = `sem-card-${s}`;

      let subjectsHTML = '';
      for (let j = 1; j <= 5; j++) {
        subjectsHTML += `
          <div class="subject-block" id="s${s}-sub${j}" ${j > 2 ? 'style="display:none"' : ''}>
            <div class="subject-num">SUBJECT ${j}</div>
            <div class="subject-grid">
              <div class="subject-name">
                <label>Subject Name</label>
                <input type="text" placeholder="e.g. Data Structures" id="s${s}-j${j}-name">
              </div>
              <div>
                <label>Credit Hours</label>
                <input type="number" placeholder="3" min="1" max="4" step="0.5" id="s${s}-j${j}-ch">
              </div>
              <div>
                <label>Marks / 100</label>
                <input type="number" placeholder="75" min="0" max="100" id="s${s}-j${j}-marks">
              </div>
            </div>
          </div>`;
      }

      card.innerHTML = `
        <div class="card-title">Semester ${s}</div>
        <div class="counter-row">
          <span class="counter-label">Subjects</span>
          <div class="counter-ctrl">
            <button class="counter-btn" onclick="adjSubjects(${s},-1)">−</button>
            <div class="counter-val" id="s${s}-subcount">2</div>
            <button class="counter-btn" onclick="adjSubjects(${s},+1)">+</button>
          </div>
        </div>
        ${subjectsHTML}
      `;
      sheets.appendChild(card);
    }
    
    // Toggle visibility based on selected semCount
    if (card) {
      card.style.display = (s <= semCount) ? 'block' : 'none';
    }
  }
}

function adjSubjects(sem, delta) {
  const countEl = document.getElementById(`s${sem}-subcount`);
  let cur = parseInt(countEl.textContent);
  const next = Math.min(10, Math.max(2, cur + delta));
  if (next === cur) return;

  for (let j = 1; j <= 10; j++) {
    let el = document.getElementById(`s${sem}-sub${j}`);
    if (!el && j <= next) {
      const card = document.getElementById(`sem-card-${sem}`);
      el = document.createElement('div');
      el.className = 'subject-block';
      el.id = `s${sem}-sub${j}`;
      el.innerHTML = `
        <div class="subject-num">SUBJECT ${j}</div>
        <div class="subject-grid">
          <div class="subject-name">
            <label>Subject Name</label>
            <input type="text" placeholder="e.g. Data Structures" id="s${sem}-j${j}-name">
          </div>
          <div>
            <label>Credit Hours</label>
            <input type="number" placeholder="3" min="1" max="4" step="0.5" id="s${sem}-j${j}-ch">
          </div>
          <div>
            <label>Marks / 100</label>
            <input type="number" placeholder="75" min="0" max="100" id="s${sem}-j${j}-marks">
          </div>
        </div>`;
      card.appendChild(el);
    }
    if (el) el.style.display = j <= next ? 'block' : 'none';
  }
  countEl.textContent = next;
}

/* ── Alert ── */
function showAlert(msg) {
  const el = document.getElementById('alert-box');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

/* ── Calculate & Global Data for PDF ── */
let globalResults = [];
let globalCGPA = "0.00";

document.getElementById('calc-btn').addEventListener('click', calculate);

function calculate() {
  document.getElementById('alert-box').style.display = 'none';
  const results = [];

  for (let s = 1; s <= semCount; s++) {
    const countEl = document.getElementById(`s${s}-subcount`);
    if (!countEl) continue;
    const numSubj = parseInt(countEl.textContent);

    let totalCH = 0, totalGP = 0;
    const rows = [];

    for (let j = 1; j <= numSubj; j++) {
      const nameEl  = document.getElementById(`s${s}-j${j}-name`);
      const chEl    = document.getElementById(`s${s}-j${j}-ch`);
      const marksEl = document.getElementById(`s${s}-j${j}-marks`);
      if (!nameEl || !chEl || !marksEl) continue;

      const name  = nameEl.value.trim() || `Subject ${j}`;
      const ch    = parseFloat(chEl.value);
      const marks = parseFloat(marksEl.value);

      if (isNaN(ch) || ch < 1 || ch > 4) {
        showAlert(`Semester ${s} / Subject ${j}: Credit hours must be between 1 and 4.`);
        return;
      }
      if (isNaN(marks) || marks < 0 || marks > 100) {
        showAlert(`Semester ${s} / Subject ${j}: Marks must be between 0 and 100.`);
        return;
      }

      const grade = getGrade(marks);
      const gp    = grade.ng * ch;
      totalCH += ch;
      totalGP += gp;
      rows.push({ name, ch, marks, ng: grade.ng, letter: grade.letter, gp });
    }

    const sgpa = totalCH > 0 ? totalGP / totalCH : 0;
    results.push({ sem: s, rows, totalCH, totalGP, sgpa });
  }

  let allCH = 0, allGP = 0;
  results.forEach(r => { allCH += r.totalCH; allGP += r.totalGP; });
  const cgpa = allCH > 0 ? allGP / allCH : 0;
  
  globalResults = results;
  globalCGPA = cgpa.toFixed(2);

  renderResults(results, cgpa);
}

function renderResults(results, cgpa) {
  document.getElementById('cgpa-display').textContent = cgpa.toFixed(2);
  const pct = (cgpa / 4.00) * 100;
  setTimeout(() => {
    document.getElementById('grade-bar').style.width = pct + '%';
  }, 100);

  const pillsWrap = document.getElementById('sgpa-pills');
  pillsWrap.innerHTML = '';
  results.forEach(r => {
    const p = document.createElement('div');
    p.className = 'sem-pill';
    p.innerHTML = `
      <div class="sem-pill-label">SEM ${r.sem} SGPA</div>
      <div class="sem-pill-value">${r.sgpa.toFixed(2)}</div>`;
    pillsWrap.appendChild(p);
  });

  const tabs = document.getElementById('result-tabs');
  const tableWrap = document.getElementById('result-table-wrap');
  tabs.innerHTML = '';
  tableWrap.innerHTML = '';

  results.forEach((r, idx) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (idx === 0 ? ' active' : '');
    tab.textContent = `SEM ${r.sem}`;
    tab.addEventListener('click', () => {
      tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      tableWrap.querySelectorAll('.sem-table').forEach(t => t.classList.add('hidden'));
      document.getElementById(`sem-table-${r.sem}`).classList.remove('hidden');
    });
    tabs.appendChild(tab);

    const div = document.createElement('div');
    div.className = 'sem-table' + (idx > 0 ? ' hidden' : '');
    div.id = `sem-table-${r.sem}`;

    let rows = r.rows.map(row => `
      <tr>
        <td>${row.name}</td>
        <td class="text-right">${row.marks.toFixed(1)}</td>
        <td class="text-right">${row.ch.toFixed(1)}</td>
        <td class="text-right">${row.ng.toFixed(2)}</td>
        <td><span class="grade-badge ${gradeBadgeClass(row.letter)}">${row.letter}</span></td>
        <td class="text-right text-primary"><strong>${row.gp.toFixed(2)}</strong></td>
      </tr>`).join('');

    div.innerHTML = `
      <table class="result-table">
        <thead>
          <tr>
            <th>Subject</th>
            <th class="text-right">Marks</th>
            <th class="text-right">CH</th>
            <th class="text-right">NG</th>
            <th>Grade</th>
            <th class="text-right">Grade Pts</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr>
            <td colspan="2"></td>
            <td class="text-right"><strong>${r.totalCH.toFixed(1)}</strong></td>
            <td></td>
            <td></td>
            <td class="text-right"><strong class="text-primary">${r.totalGP.toFixed(2)}</strong></td>
          </tr>
          <tr>
            <td colspan="6" style="padding-top:16px; font-family:'Poppins',sans-serif; font-size:13px; color:var(--primary); font-weight: 600;">
              SGPA : ${r.sgpa.toFixed(2)} / 4.00
            </td>
          </tr>
        </tfoot>
      </table>`;
    tableWrap.appendChild(div);
  });

  document.getElementById('results-section').style.display = 'block';
  document.getElementById('results-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

  const pdfContainer = document.createElement('div');

    <div style="padding: 40px; font-family: 'Inter', sans-serif; color: #0f172a; background: #ffffff;">
      <div style="text-align: center; border-bottom: 3px solid #3b82f6; padding-bottom: 20px; margin-bottom: 30px;">
        <h1 style="margin: 0; font-family: 'Poppins', sans-serif; font-size: 28px; color: #0f172a;">UNIVERSITY OF HARIPUR</h1>
        <h3 style="margin: 8px 0 0 0; font-size: 16px; font-weight: 500; color: #64748b; letter-spacing: 0.1em; text-transform: uppercase;">Official Academic Transcript</h3>
      </div>
      
      <div style="display: flex; justify-content: space-between; margin-bottom: 40px; font-size: 14px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0;">
        <div style="line-height: 1.8;">
          <div><strong style="color: #475569;">Name:</strong> <span style="font-weight: 600;">${name}</span></div>
          <div><strong style="color: #475569;">Roll Number:</strong> <span style="font-weight: 600;">${roll}</span></div>
        </div>
        <div style="line-height: 1.8; text-align: right;">
          <div><strong style="color: #475569;">Program:</strong> <span style="font-weight: 600;">${prog}</span></div>
          <div><strong style="color: #475569;">Date of Issue:</strong> ${dateStr}</div>
        </div>
      </div>

      <div style="text-align: center; margin-bottom: 40px;">
        <div style="font-size: 14px; color: #475569; text-transform: uppercase; font-weight: 600; letter-spacing: 0.1em; margin-bottom: 5px;">Cumulative GPA</div>
        <div style="font-size: 42px; font-family: 'Poppins', sans-serif; font-weight: bold; color: #3b82f6;">${globalCGPA}</div>
      </div>

      ${tablesHTML}
      
      <div style="margin-top: 50px; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 20px;">
        Generated via University of Haripur GPA Calculator Portal
      </div>
    </div>
  `;

  const opt = {
    margin:       0.2,

    html2canvas:  { scale: 2, useCORS: true },
    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(pdfContainer).save();
});

/* ── Reset ── */
document.getElementById('reset-btn').addEventListener('click', () => {
  document.getElementById('sem-sheets').innerHTML = ''; // This intentionally clears fields back to fresh
  document.getElementById('results-section').style.display = 'none';
  document.getElementById('calc-wrap').classList.add('hidden');
  document.getElementById('grade-bar').style.width = '0%';
  buildSheets(); // Reinitialize semester 1 empty
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

window.addEventListener('load', buildSheets);
</script>
